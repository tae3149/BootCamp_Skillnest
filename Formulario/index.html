<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>

    <h1>¡Regístrate y únete a nuestra comunidad!</h1>

    <div><br>
            <label for="nombre_id">Nombre:</label>
            <input type="text" name="nombre_usuario" id="nombre_id"></br>
     </div>



     <div><br>
        <label for="apellido_id">Apellido:</label>
        <input type="text" name="apellido_usuario" id="apellido_id"></br>
     </div>

     <div><br>
        <label for="correo_electronico">Correo electrónico:</label>
        <input type="text" name="correo_electronico_usuario" id="correo_electronico_id"></br>
     </div>

     <div><br>
        <label for="contraseña_id">Contraseña:</label>
        <input type="text" name="contraseña_usuario" id="contraseña_id"></br>
     </div>


     <div><br>
        <label for="confirmar_contraseña_id">Confirmar contraseña:</label>
        <input type="text" name="confirmar_contraseña_usuario" id="confirmar_contraseña_id"></br>
     </div>

     <div><br>
         <label for="fecha_id">Fecha de Nacimiento:</label>
        <input type="date" name="fecha_nacimiento" id="fecha_id"></br>
     </div>

     <div><br>
            <label>Género:</label>
            <input type="radio" name="genero" value="femenino" id="femenino_id" >
            <label for="femenino_id">Femenino</label>
            <input type="radio" name="genero" value="masculino" id="masculino_id" >
            <label for="masculino_id">Masculino</label>
            <input type="radio" name="genero" value="prefiero_no_decir" id="prefiero_no_decir_id" >
            <label for="prefiero_no_decir_id">Prefiero no decir</label></br>
         </div>

         <div><br>
            <input type="checkbox" name="suscribete" id="suscribete" >
            <label for="suscribete">Suscríbete a nuestro boletín de noticias</label></br>
        </div>

    <br>Una descripción de mí mismo</br>

    <div>
            <textarea name="descripcion" cols="30" rows="8" maxlength="20" ></textarea><br>
        </div>


       <br> Selecciona tus intereses</br>

    <div>
            <input type="checkbox" name="intereses" id="intereses" >
            <label for="suscribete">Música</label><br>
            <input type="checkbox" name="intereses" id="intereses" >
            <label for="suscribete">Deportes</label></br>
            <input type="checkbox" name="intereses" id="intereses" >
            <label for="suscribete">Viajes</label><br>
            <input type="checkbox" name="intereses" id="intereses" >
            <label for="suscribete">Tecnología</label></br>
        </div>

    <div><br>
            <input type="submit" value="¡Regístrarse!"></br>
        </div>
</body>

</html>
